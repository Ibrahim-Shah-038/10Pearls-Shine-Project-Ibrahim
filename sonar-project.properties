# Project identification
sonar.projectKey=TaskManagementSystem
sonar.projectName=Task Management System
sonar.projectVersion=1.0

# Path to source directories (relative to this file)
sonar.sources=TaskManagement.API,taskmanagement-ui/src
sonar.tests=TaskManagement.Tests

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclusions - folders to skip from code analysis
sonar.exclusions=**/node_modules/**, **/bin/**, **/obj/**, **/Migrations/**, **/Properties/**, **/*.spec.js, **/*.test.js, taskmanagement-ui/src/reportWebVitals.js, taskmanagement-ui/src/setupTests.js

# Test results and coverage reports configuration
sonar.cs.opencover.reportsPaths=TaskManagement.Tests/TestResults/**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=taskmanagement-ui/coverage/lcov.info
